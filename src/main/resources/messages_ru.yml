  footer: "&8&m--------------------------------------&r"

stats:
  header: "&7--- &bSilentDrop &7статистика ---"
  line: "&7%key%: &e%value%"

give:
  usage: "&7/sd give <игрок> <МАТЕРИАЛ> [кол-во]"
  ok: "&aВыдано &e%count% x %item% &aигроку &e%player%"
  bad-material: "&cНеизвестный материал: &e%material%"
  player-offline: "&cИгрок не найден: &e%player%"

clear:
  usage: "&7/sd clear <игрок|all>"
  ok: "&aХранилище &e%player% &aочищено (записей: &e%count%&a)."

debug:
  header: "&7[SD DEBUG] %text%"
