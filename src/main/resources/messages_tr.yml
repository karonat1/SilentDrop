# ============================================================================
#  SilentDrop - Türkçe mesajlar
#
#  config.yml içinde general.language: tr ile etkinleştirilir.
#  Burada olmayan anahtarlar messages_en.yml dosyasından alınır.
#  Boş değer ("") mesajı kapatır.
#
#  Renk: &a &7 &e ... ve &#RRGGBB (1.16+)
#
#  Yer tutucular:
#    %player% - oyuncu adı, %mob% - yaratık adı, %count% - adet,
#    %stacks% - yığın sayısı, %owner% - korunan eşyanın sahibi,
#    %left% - kasada kalan, %time% - kayıt zamanı, %reason% - sebep,
#    %ms%, %rules%, %key%, %value%, %item%, %material%, %page%, %pages%, %max%
# ============================================================================

